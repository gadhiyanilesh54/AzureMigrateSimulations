services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - MIGRATE_API_KEY=${MIGRATE_API_KEY:-}
      - PYTHONPATH=/app/src
      - AZURE_MIGRATE_CHAT_ENDPOINT=${AZURE_MIGRATE_CHAT_ENDPOINT:-}
      - AZURE_MIGRATE_CHAT_DEPLOYMENT=${AZURE_MIGRATE_CHAT_DEPLOYMENT:-}
      - AZURE_MIGRATE_CHAT_API_VERSION=${AZURE_MIGRATE_CHAT_API_VERSION:-2024-12-01-preview}
      - AZURE_MIGRATE_CHAT_API_KEY=${AZURE_MIGRATE_CHAT_API_KEY:-}
    command: python -m azure_migrate_simulations.web.app

  mcp-sse:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - MCP_PORT=3001
      - PYTHONPATH=/app/src
    command: python -m azure_migrate_simulations.mcp_server --sse
    depends_on:
      - web
